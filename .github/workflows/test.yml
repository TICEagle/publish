name: test

on: push

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - shell: bash
        run: |
          python=$(command -v python || command -v python3)
          "$python" test/fake_api.py > "$RUNNER_TEMP/requests" &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 --max-time 5 http://127.0.0.1:8787/ready
      - id: token
        uses: ./
        with:
          version: 1.0.0
          working-directory: test
          api-url: http://127.0.0.1:8787
          token: ceagle_TEST
      - id: oidc
        uses: ./
        with:
          version: 1.0.0
          working-directory: test
          api-url: http://127.0.0.1:8787
      - shell: bash
        env:
          TOKEN_STATUS: ${{ steps.token.outputs.status }}
          TOKEN_URL: ${{ steps.token.outputs.url }}
          OIDC_STATUS: ${{ steps.oidc.outputs.status }}
        run: |
          cat "$RUNNER_TEMP/requests"
          [[ $TOKEN_STATUS == published && $OIDC_STATUS == published ]]
          [[ $TOKEN_URL == http://127.0.0.1:8787/p/selftest/1.0.0 ]]
          grep -q "Bearer ceagle_TEST" "$RUNNER_TEMP/requests"
          grep -q "POST /api/v1/oidc/github/exchange" "$RUNNER_TEMP/requests"
          grep -q "Bearer ceagle_OIDC attestation" "$RUNNER_TEMP/requests"
          [[ $(grep -c "Bearer ceagle_TEST attestation" "$RUNNER_TEMP/requests" || true) == 0 ]]
